name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:

# Скасовувати попередній прогін на тій самій гілці — економія macOS-хвилин.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build & test core (Linux)
        run: swift test

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
      - name: Core package tests (macOS)
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build -project VocabApp.xcodeproj -scheme VocabApp \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- | tail -n 200
      - name: Test app
        run: |
          set -o pipefail
          xcodebuild test -project VocabApp.xcodeproj -scheme VocabApp \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- | tail -n 300
