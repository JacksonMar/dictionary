name: VocabApp
options:
  bundleIdPrefix: com.vocabapp
  deploymentTarget: { macOS: "13.0" }
  # M9 (D38): `*.lproj` у `App/Resources` стають variant group; базова мова — англійська.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
packages:
  VocabCore: { path: . }
targets:
  VocabApp:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    settings:
      base:
        PRODUCT_NAME: VocabApp
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabapp.VocabApp
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VocabCore
        product: VocabCore
  VocabAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Tests]
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: com.vocabapp.VocabAppTests }
    dependencies:
      - target: VocabApp          # hosted tests: TEST_HOST = VocabApp.app
schemes:
  VocabApp:
    build:
      targets: { VocabApp: all, VocabAppTests: [test] }
    test:
      config: Debug
      targets: [VocabAppTests]
